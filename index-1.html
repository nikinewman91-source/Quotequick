<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteQuick — Cleaning Estimates</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f2f7f6;color:#17332f;margin:0}main{max-width:580px;margin:auto;padding:20px}h1{color:#086d60}section{background:white;padding:18px;border-radius:15px;box-shadow:0 3px 14px #153b3212;margin:16px 0}label{display:block;font-size:14px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b7ccc6;border-radius:9px;font:inherit}button{border:0;border-radius:10px;padding:13px 18px;background:#087665;color:white;font-weight:700;margin:8px 8px 0 0}button.secondary{background:#e2efeb;color:#155449}.total{font-size:36px;font-weight:800;color:#087665}.muted{color:#56736b;font-size:13px}@media print{.no-print{display:none}body{background:white}section{box-shadow:none;border:1px solid #ddd}}</style></head><body><main><h1>QuoteQuick</h1><p>Professional cleaning estimates in minutes.</p><section class="no-print"><label>Your business name</label><input id="business" placeholder="Your Cleaning Company"><label>Customer name</label><input id="customer" placeholder="Customer name"><label>Service</label><select id="service"><option value="standard">Standard cleaning</option><option value="deep">Deep cleaning</option><option value="move">Move-out cleaning</option></select><label>Estimated hours</label><input id="hours" type="number" min="0" step="0.5" value="3"><label>Hourly rate ($)</label><input id="rate" type="number" min="0" step="1" value="45"><label>Supplies / additional fees ($)</label><input id="fees" type="number" min="0" step="1" value="0"><label>Discount ($)</label><input id="discount" type="number" min="0" step="1" value="0"><label>Sales tax rate (%) — set as applicable</label><input id="tax" type="number" min="0" max="100" step="0.1" value="6"><label>Notes</label><textarea id="notes" rows="3" placeholder="Scope, exclusions, and expiration date"></textarea><button onclick="calculate()">Update estimate</button><button class="secondary" onclick="save()">Save on this phone</button><button class="secondary" onclick="window.print()">Print / Save PDF</button></section><section id="quote" aria-live="polite"></section><p class="muted">Prototype only. Estimates are stored only in this browser when saved. Verify applicable taxes, fees, and terms before using with customers. No payments or accounts are included.</p></main><script>const ids=['business','customer','service','hours','rate','fees','discount','tax','notes'];const get=id=>document.getElementById(id).value;const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);function calculate(){let h=Math.max(0,Number(get('hours'))||0),r=Math.max(0,Number(get('rate'))||0),f=Math.max(0,Number(get('fees'))||0),d=Math.max(0,Number(get('discount'))||0),t=Math.max(0,Number(get('tax'))||0);let subtotal=Math.max(0,h*r+f-d),tax=subtotal*t/100;let q=document.getElementById('quote');q.replaceChildren();function line(tag,value,cls){let e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;q.appendChild(e)}line('h2',get('business')||'Your Business');line('p','Estimate for: '+(get('customer')||'Customer'));line('p','Service: '+({standard:'Standard cleaning',deep:'Deep cleaning',move:'Move-out cleaning'}[get('service')]));line('p',`Labor: ${h} hours × ${money(r)} = ${money(h*r)}`);line('p','Additional fees: '+money(f));line('p','Discount: '+money(d));line('p','Subtotal: '+money(subtotal));line('p',`Sales tax (${t}%): ${money(tax)}`);line('p',money(subtotal+tax),'total');if(get('notes'))line('p','Notes: '+get('notes'));line('p','Created: '+new Date().toLocaleDateString())}function save(){try{localStorage.setItem('quotequickDraft',JSON.stringify(Object.fromEntries(ids.map(id=>[id,get(id)]))));alert('Saved on this device.')}catch(e){alert('Browser storage is unavailable.')}}try{let saved=JSON.parse(localStorage.getItem('quotequickDraft')||'null');if(saved)ids.forEach(id=>{if(saved[id]!==undefined)document.getElementById(id).value=saved[id]})}catch(e){}ids.forEach(id=>document.getElementById(id).addEventListener('input',calculate));calculate();</script></body></html>
